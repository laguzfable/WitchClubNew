<!-- 劇本檢視器 — 用瀏覽器打開這個檔案，把 Assets/NaniScripts 資料夾拖進來
     不需要 Unity，不需要安裝任何東西，也不會動到你的檔案（只讀） -->
<meta charset="utf-8">
<title>劇本檢視器</title>
<style>
  :root{
    --bg:#14131a; --panel:#1c1b24; --line:#2c2a37; --ink:#e8e6f0; --dim:#8f8ba3;
    --gold:#c9a227; --rose:#d98ca0; --blue:#7aa2d9; --green:#7fb98a; --red:#d97a7a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        flex-direction:column;gap:16px;background:var(--bg);z-index:10;text-align:center}
  #drop.hide{display:none}
  #drop .box{border:2px dashed var(--line);border-radius:16px;padding:56px 72px}
  #drop h1{font-size:20px;margin:0 0 8px;font-weight:600}
  #drop p{color:var(--dim);margin:4px 0}
  #drop.over .box{border-color:var(--gold);background:#1a1822}
  button,label.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);
        border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px}
  button:hover,label.btn:hover{border-color:var(--gold)}
  button.on{border-color:var(--gold);color:var(--gold)}
  #app{display:none;grid-template-columns:250px 1fr;height:100vh}
  #app.show{display:grid}
  aside{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  aside .head{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;
        background:var(--panel);display:flex;gap:8px;align-items:center}
  aside input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
        border-radius:6px;color:var(--ink);padding:6px 8px;font:inherit;font-size:13px}
  .file{padding:8px 14px;cursor:pointer;border-bottom:1px solid #23212c;display:flex;
        justify-content:space-between;gap:8px;align-items:baseline}
  .file:hover{background:#232130}
  .file.sel{background:#2a2739;box-shadow:inset 3px 0 var(--gold)}
  .file .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .m{color:var(--dim);font-size:11px;white-space:nowrap}
  .file .m .err{color:var(--red)}
  main{overflow-y:auto;padding:20px 26px 80px}
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pages{padding:6px 8px 8px;border-bottom:1px solid var(--line)}
  .pg{display:flex;align-items:center;padding:5px 9px;border-radius:6px;font-size:12px;
      color:var(--dim);cursor:pointer}
  .pg:hover{background:#241f30;color:var(--ink)}
  .pg.on{background:#2b2438;color:var(--gold)}
  .pg .badge{margin-left:auto;font-size:10px;color:var(--red)}
  .pg .badge.on::before{content:'✕'}
  .sec{padding:8px 10px 4px;font-size:10px;color:#54506a;letter-spacing:1px}
  .file.undone .n{color:var(--gold)}
  .file .dot{color:var(--gold);font-size:9px;margin-right:5px;vertical-align:1px}
  #newbuild{position:fixed;left:50%;transform:translateX(-50%);top:0;z-index:99;
    background:var(--gold);color:#221f2c;padding:6px 14px;border-radius:0 0 9px 9px;
    font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 14px rgba(0,0,0,.45)}
  #newbuild button{background:#221f2c;color:var(--gold);border:0;border-radius:5px;
    padding:3px 10px;font-size:12px;cursor:pointer}
  #newbuild span{cursor:pointer;font-size:14px}
  #saveall{margin-top:7px}
  #saveall button{width:100%;background:#2b2438;color:var(--gold);border:1px solid var(--gold);
    border-radius:6px;padding:4px;font-size:12px;cursor:pointer}
  #saveall button:hover{background:#352c46}
  h2{font-size:17px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .block{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .block>.t{background:#221f2c;padding:8px 12px;font-weight:600;color:var(--gold);
        display:flex;justify-content:space-between;gap:10px;cursor:pointer}
  .block>.t .c{color:var(--dim);font-weight:400;font-size:12px}
  .block>.b{padding:6px 12px 10px}
  .row{display:flex;gap:8px;padding:3px 0;align-items:baseline;font-size:13px}
  .row .ln{color:#54506a;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;
        font-family:ui-monospace,Consolas,monospace;font-size:11px}
  .tag{border-radius:5px;padding:1px 7px;font-size:11px;white-space:nowrap;border:1px solid}
  .t-choice{color:var(--rose);border-color:#5a3a45}
  .t-goto{color:var(--blue);border-color:#35496b}
  .t-aff{color:var(--green);border-color:#3a5c42}
  .t-end{color:var(--gold);border-color:#5c4c1e}
  .t-battle{color:#d9a37a;border-color:#5c452e}
  .t-map{color:#a99ad9;border-color:#463c6b}
  .jump{color:var(--blue);cursor:pointer;text-decoration:underline dotted}
  .txt{color:var(--dim)}
  .issue{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;
        padding:8px 12px;margin-bottom:8px}
  .issue.warn{border-left-color:var(--gold)}
  .issue .w{color:var(--dim);font-size:12px}
  .stat{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:8px 14px;
        margin:0 8px 8px 0}
  .stat b{color:var(--gold);font-size:18px}
  .empty{color:var(--dim);padding:28px 0}
  .scenes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
        max-width:1500px}
  .scene{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .scene .stage{position:relative;aspect-ratio:16/9;background:#0d0c11;overflow:hidden}
  .scene .stage img{width:100%;height:100%;object-fit:cover;display:block}
  .scene .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        color:#4d4960;font-size:13px}
  .actor{position:absolute;bottom:8%;transform:translateX(-50%);text-align:center}
  .actor:hover,.actor:focus-within{z-index:8}
  .actor .pos.clash{color:var(--red)}
  /* 人多的時候整個縮一號，擠得下 */
  .actor.tight .card{padding:2px 4px;font-size:10px}
  .actor.tight .pos{font-size:8px}
  /* 名字自己縮，× 永遠留在外面——不然名字一長，叉叉會被裁掉按不到 */
  .actor .card{background:rgba(20,19,26,.85);border:1px solid var(--gold);border-radius:6px;
        padding:3px 7px;font-size:11px;white-space:nowrap;line-height:1.4;
        display:flex;align-items:center;gap:2px;overflow:hidden}
  .actor .card .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  /* 中間隔了可以跳進來的段落：她在不在台上要看玩家怎麼走 */
  .actor .card.guess{border-style:dashed;border-color:#7d7898}
  .actor .card .q{color:#c9a227;margin-left:3px;font-style:normal}
  .actor .pos{color:var(--dim);font-size:9px;margin-top:2px;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .actor.drag{z-index:9}
  .scene .bar{display:flex;gap:6px;align-items:center;padding:6px 9px;background:#221f2c;
        flex-wrap:wrap;font-size:12px}
  .scene .bar .ln{color:#54506a;font-family:ui-monospace,Consolas,monospace}
  .scene .line{padding:5px 9px 8px;color:var(--dim);font-size:12px}
  .scene .lines{padding:5px 9px 6px;color:var(--dim);font-size:12px;max-height:190px;overflow:auto}
  .scene .lines div{padding:1px 0;display:flex;align-items:baseline;gap:4px}
  .scene .lines .edit{flex:1}
  .scene .lines .dx{color:#4a465c;cursor:pointer;padding:0 3px;font-size:12px}
  .scene .lines .blank{color:#403c52;font-size:11px}
  .scene .lines div:hover .dx{color:#7d7898}
  .scene .lines .dx:hover{color:var(--red)}
  .scene .evs{padding:2px 9px 8px;font-size:12px;border-top:1px dashed var(--line)}
  .scene .evs div{padding:2px 0;color:#9d97b8}
  .scene .cnt{color:var(--gold);font-size:11px;margin-right:6px;white-space:nowrap}
  .scene .cnt i{color:#7d7898;font-style:normal}
  .scene .lines .ln,.scene .evs .ln{display:inline-block;min-width:38px;color:#54506a;
    font-family:ui-monospace,Consolas,monospace}
  .scene .lab{color:var(--gold);font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 22px}
  .grid.wide{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .ass{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#1b1925}
  .ass img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .ass img.mob{aspect-ratio:1;object-fit:contain;background:#100f16}
  #floatplayer{position:fixed;right:14px;bottom:14px;z-index:50;width:270px;display:none;
    background:#221f2c;border:1px solid var(--gold);border-radius:10px;padding:8px 10px;
    box-shadow:0 6px 22px rgba(0,0,0,.5)}
  #floatplayer.show{display:block}
  #floatplayer .pn{display:flex;align-items:center;gap:6px;font-size:12px;padding-bottom:5px}
  #floatplayer .pn b{color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #floatplayer .px{margin-left:auto;cursor:pointer;color:#7d7898;padding:0 3px}
  #floatplayer .px:hover{color:var(--red)}
  #floatplayer .pl{font-size:11px;color:var(--dim);margin-left:auto}
  #floatplayer #ppick{width:100%;margin-bottom:6px;background:#1b1925;color:#cfc9e6;
    border:1px solid var(--line);border-radius:5px;font-size:11px;padding:2px 3px}
  #floatplayer .pf{display:flex;align-items:center;gap:5px;margin-top:6px}
  #floatplayer .pb{background:#1b1925;color:var(--dim);border:1px solid var(--line);
    border-radius:5px;font-size:11px;padding:1px 8px;cursor:pointer}
  #floatplayer .pb:hover{color:var(--gold);border-color:var(--gold)}
  #player{width:100%;height:32px}
  .play{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ass .play{width:calc(100% - 14px);margin:7px;background:#241f30;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:3px;font-size:11px;cursor:pointer}
  .ass .play:hover{color:var(--gold);border-color:var(--gold)}
  .ass .play.on{color:var(--gold);border-color:var(--gold)}
  .ass .an{padding:4px 7px 0;font-size:12px;word-break:break-all}
  .ass .au{padding:0 7px 5px;font-size:10px;color:#6b6685}
  .ass.unused{opacity:.42}
  .ass .rv{font-size:10px;padding:3px 7px;line-height:1.35}
  .ass .rv.nude{background:#4a1f28;color:#ffb3bf}
  .ass .rv.borderline{background:#4a3f1f;color:#f0d79a}
  .ass .rv.stale{background:#2b3a4a;color:#a9cbe8}
  .rvsum i{color:#a9cbe8;font-style:normal}
  .rvsum.hasstale{border-left-color:#6a9bc3}
  .rvsum{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;
    padding:7px 10px;margin:8px 0;font-size:12px;color:#d9cfe0}
  .rvsum b{color:#e08a99}
  .rvsum span{display:block;margin-top:3px;color:#6b6685;font-size:11px}
  .ass[onclick]{cursor:pointer}
  .ass[onclick]:hover{border-color:var(--gold)}
  .scene.flash{outline:2px solid var(--gold);outline-offset:2px}
  #uses{position:fixed;right:14px;bottom:150px;z-index:60;width:300px;max-height:52vh;overflow:auto;
    display:none;background:#221f2c;border:1px solid var(--gold);border-radius:10px;padding:9px 11px;
    box-shadow:0 6px 22px rgba(0,0,0,.5);font-size:12px}
  #uses.show{display:block}
  #uses .uh{display:flex;align-items:center;padding-bottom:6px;color:var(--gold)}
  #uses .uh span{color:var(--dim);font-size:11px}
  #uses .ux{margin-left:auto;cursor:pointer;color:#7d7898;padding:0 3px}
  #uses .ux:hover{color:var(--red)}
  #uses .ur{padding:3px 0;border-top:1px solid var(--line)}
  #uses .uf{color:var(--ink);margin-right:6px}
  #uses .ul{color:#9d97b8;cursor:pointer;margin-right:6px;font-size:11px;
    border-bottom:1px dashed var(--line)}
  #uses .ul:hover{color:var(--gold)}
  .miss{border:1px solid var(--red);border-radius:8px;padding:7px 10px;margin:8px 0;
    color:#e0a0a8;font-size:12px}
  .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin:10px 0 22px}
  .cha{display:flex;gap:9px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#1b1925}
  .cha img{width:86px;height:86px;object-fit:contain;background:#100f16;border-radius:5px}
  .cha b{font-size:13px;margin-right:6px}
  .exs{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px}
  .ex{font-size:10px;color:var(--dim);background:#241f30;border-radius:4px;padding:1px 5px}
  .scene .ch{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
  .scene .ch input,.scene .ch select{background:#1b1925;color:#cfc9e6;font-size:11px;
    border:1px solid var(--line);border-radius:4px;padding:1px 3px}
  .scene .chtext{min-width:190px}
  .scene .chamt{width:52px}
  .scene .chraw{color:#7d7898;font-size:10px}
  .scene .ch .x{cursor:pointer;color:#7d7898;padding:0 3px}
  .scene .ch .x:hover{color:#e06c75}
  .scene .addch{padding:5px 9px 8px;display:flex;gap:6px;flex-wrap:wrap}
  .scene .addch .more{background:#1b1925;color:var(--dim);border:1px dashed var(--line);
    border-radius:5px;font-size:11px;padding:2px 4px}
  .scene .addch button{background:#1b1925;color:var(--dim);border:1px dashed var(--line);
    border-radius:5px;font-size:11px;padding:2px 8px;cursor:pointer}
  .scene .addch button:hover{color:var(--gold);border-color:var(--gold)}
  /* 表情選單平常收起來，不然名牌會被它撐寬、彼此蓋住 */
  .actor .expr{position:absolute;left:50%;transform:translateX(-50%);top:100%;margin-top:2px;

    background:#1b1925;color:var(--dim);border:1px solid var(--line);border-radius:4px}
  .actor:hover .expr,.actor:focus-within .expr{display:block}
  .scene .expr.inline{display:inline-block;margin:0 6px 0 0;vertical-align:baseline;max-width:120px}
  .scene .edit{outline:none;border-bottom:1px dashed transparent;cursor:text}
  .scene .edit:hover{border-bottom-color:var(--line)}

  .scene .bar audio{height:24px;max-width:150px}
  .pick{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;
        font:inherit;font-size:11px;padding:2px 4px;max-width:110px}
  .pick:hover{border-color:var(--gold)}
  .pick.hot{border-color:var(--gold);color:var(--gold)}
  /* 這一幕換了曲子：整張卡的左邊立一條金線，掃過去一眼看得到 */

  .actor .x{flex:none;margin-left:4px;color:#7a7590;cursor:pointer;font-size:12px}
  .actor .x:hover{color:var(--red)}

  #bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;

  #bar .chip{border:1px solid var(--line);border-radius:14px;padding:3px 11px;font-size:12px;
       cursor:grab;background:var(--panel)}
  #bar .chip:hover{border-color:var(--gold)}

</style>

<div id="drop">
  <div class="box">
    <h1>劇本檢視器</h1>
    <p>把 <code>Assets/NaniScripts</code> 整個資料夾拖進來</p>
    <p style="margin-top:14px">
      <label class="btn">或點這裡選檔案
        <input type="file" id="pick" multiple accept=".nani" hidden>
      </label>
    </p>
    <p style="font-size:12px;margin-top:18px">只讀，不會動到你的檔案</p>
  </div>
</div>

<div id="app">
  <aside>
    <div class="head"><input id="q" placeholder="搜尋腳本或台詞"><div id="saveall"></div></div>
    <div class="pages">
      <div class="pg" data-tab="issues">檢查<span class="badge" id="badge-issues"></span></div>
      <div class="pg" data-tab="affinity">好感總覽</div>
      <div class="pg" data-tab="endings">結局</div>
      <div class="pg" data-tab="assets">資源</div>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="tabs" id="viewtabs">
      <button data-tab="scenes" class="on">場景</button>
      <button data-tab="outline">結構</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
const CHAR = {affinity_Eup:'優菲', affinity_Mel:'梅爾', affinity_Ved:'薇狄亞',
              affinity_Nel:'涅莉', affinity_Syb:'西碧兒'};
// 產生資料版時，build_viewer.py 會把下面這行換成真的資料（見 tools/build_viewer.py）
const EMBEDDED = null;
// 背景與音樂的檔案路徑（build_viewer.py 從 EditorResources 對出來的）
const ASSETS = null;

const NL = String.fromCharCode(10);
// build_viewer.py 每次產生時會把時間戳寫進來，用來認出「你開著的是舊程式」
const BUILD = '';
let scripts = {};      // name -> {name, lines}
let issues = [];
let current = null;
let tab = 'scenes';

// ── 讀檔 ──────────────────────────────────────────────
const drop = document.getElementById('drop');
drop.addEventListener('dragover', e => {e.preventDefault(); drop.classList.add('over')});
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', async e => {
  e.preventDefault(); drop.classList.remove('over');
  const files = [];
  for (const item of e.dataTransfer.items) {
    const entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
    if (entry) await walk(entry, files);
    else if (item.getAsFile) files.push(item.getAsFile());
  }
  load(files);
});
document.getElementById('pick').addEventListener('change', e => load([...e.target.files]));

async function walk(entry, out) {
  if (entry.isFile) {
    if (entry.name.endsWith('.nani'))
      out.push(await new Promise(r => entry.file(r)));
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise(r => reader.readEntries(r));
      for (const e of batch) await walk(e, out);
    } while (batch.length);
  }
}

async function load(files) {
  files = files.filter(f => f.name.endsWith('.nani'));
  if (!files.length) return alert('沒有找到 .nani 檔案');
  for (const f of files) {
    const name = f.name.replace(/\.nani$/, '');
    scripts[name] = {name, lines: (await f.text()).split(/\r?\n/)};
  }
  check();
  drop.classList.add('hide');
  document.getElementById('app').classList.add('show');
  renderList();
  tab = 'scenes';
  syncTabs();
  select(Object.keys(scripts).sort(scriptOrder)[0]);
}

// ── 解析 ──────────────────────────────────────────────
function labelsOf(s) {
  const set = new Set();
  s.lines.forEach(l => {const t = l.trim(); if (t.startsWith('#')) set.add(t.slice(1).trim())});
  set.delete('');
  return set;
}

function parse(s) {
  const out = [];
  let block = {label: '（開頭）', line: 1, items: [], talk: 0, first: ''};
  s.lines.forEach((raw, i) => {
    const t = raw.trim(), no = i + 1;
    if (!t || t.startsWith(';')) return;

    if (t.startsWith('#')) {
      out.push(block);
      block = {label: t.slice(1).trim() || '（無名）', line: no, items: [], talk: 0, first: ''};
      return;
    }
    const add = (kind, text, jump) => block.items.push({kind, text, jump, line: no});

    if (t.startsWith('@choice')) {
      const body = t.slice(7).trim();
      const g = body.match(/goto:\.?([\w.]+)/);
      const a = body.match(/affinity_(\w+)=affinity_\1\+(\d+)/);
      const txt = body.split(/\s+(?:set:|goto:|if:)/)[0].replace(/^"|"$/g, '');
      add('choice', txt + (a ? `　＋${a[2]} ${CHAR['affinity_' + a[1]] || a[1]}` : ''), g && g[1]);
    }
    else if (/^@goto /.test(t)) {
      const m = t.match(/@goto \.?([\w.]+)/);
      add('goto', t.replace(/^@goto\s+/, ''), m && m[1]);
    }
    else if (/^@achieve/.test(t)) add('end', t.replace(/^@achieve\s+id:/, ''));
    else if (/^@battle/.test(t)) {
      const m = t.match(/target:(\S+)/);
      add('battle', '戰鬥　' + (m ? m[1] : ''));
    }
    else if (/GotoUnityScene sceneName:MapTest/.test(t)) add('map', '進地圖');
    else if (/^@set .*affinity_/.test(t)) {
      const m = t.match(/affinity_(\w+)=affinity_\1([+\-]\d+)/) || t.match(/(affinity_\w+)=(\d+)/);
      add('aff', m ? (t.includes('+') || t.includes('-')
            ? `${CHAR['affinity_' + m[1]] || m[1]}　${m[2]}`
            : `${CHAR[m[1]] || m[1]}　設為 ${m[2]}`) : t);
    }
    else if (/^@overrideEvent/.test(t)) add('map', t.replace('@overrideEvent ', '預約事件　'));
    else if (!t.startsWith('@')) {  // 台詞或旁白
      block.talk++;
      if (!block.first) block.first = t.length > 40 ? t.slice(0, 40) + '…' : t;
    }
  });
  out.push(block);
  // 只有台詞的段落也要留著——它一樣是 @goto 的目標
  return out.filter(b => b.items.length || b.talk);
}

// ── 檢查（規則跟 Unity 那支一致）────────────────────────
// 戰鬥回來之後，第一句話之前有沒有把 BGM 換掉。
// 要跟著 @goto 走——戰鬥後面常常只是個分歧點（@if CombatWin → @goto），
// 真正設音樂的是跳過去之後的段落。
function resumesBgm(name, from, labelsOf, depth) {
  depth = depth || 0;
  if (depth > 4) return true;                 // 追太多層就別報了，寧可漏報
  const sc = scripts[name];
  if (!sc) return true;

  for (let k = from; k < sc.lines.length; k++) {
    const t = sc.lines[k].trim();
    if (!t || t.startsWith(';')) continue;
    if (/^@(bgm\s|stopBgm)/i.test(t)) return true;
    const g = t.match(/^@goto\s+(\S+)/);
    if (g) {
      const tgt = g[1];
      const file = tgt.includes('.') && !tgt.startsWith('.') ? tgt.split('.')[0] : name;
      const lab = tgt.startsWith('.') ? tgt.slice(1)
                : tgt.includes('.') ? tgt.split('.').slice(1).join('.') : '';
      if (!scripts[file]) return true;
      const at = lab
        ? scripts[file].lines.findIndex(l => l.trim().replace(/\s+/g, '') === '#' + lab)
        : 0;
      return at < 0 ? true : resumesBgm(file, at + 1, labelsOf, depth + 1);
    }
    if (/^@(if|else|endif)\b/.test(t)) continue;   // 分歧：繼續往下看
    if (!t.startsWith('@')) return false;                      // 開始講話了還沒重設
  }
  return false;
}

function check() {
  ROUTE = null;          // 劇本動過，路線要重算
  issues = [];
  const labels = {};
  for (const n in scripts) labels[n] = labelsOf(scripts[n]);

  for (const n in scripts) {
    // 備份和測試檔不檢查——它們本來就是半成品，報出來只會蓋掉真的問題
    if (/備份|^Test|^111|^222|Test$/.test(n)) continue;

    const s = scripts[n], lab = labels[n], seen = new Set();

    s.lines.forEach((raw, i) => {
      const t = raw.trim(), no = i + 1;
      if (!t || t.startsWith(';')) return;

      if (t.startsWith('#')) {
        const l = t.slice(1).trim();
        if (l && seen.has(l)) bad(n, no, `label「${l}」重複了，@goto 只會跳到第一個`);
        seen.add(l);
        return;
      }
      if (t.startsWith('goto:')) bad(n, no, '少了 @：這行會被當成旁白印出來');

      for (const m of t.matchAll(/@goto \.(\S+)/g))
        if (!lab.has(m[1])) bad(n, no, `跳不到：這支腳本裡沒有 label「${m[1]}」`);
      for (const m of t.matchAll(/goto:\.(\S+)/g))
        if (!lab.has(m[1])) bad(n, no, `跳不到：這支腳本裡沒有 label「${m[1]}」`);
      for (const m of t.matchAll(/@goto (\w+)\.(\w+)/g)) {
        if (!labels[m[1]]) bad(n, no, `跳不到：找不到腳本「${m[1]}」`);
        else if (!labels[m[1]].has(m[2])) bad(n, no, `跳不到：「${m[1]}」裡沒有 label「${m[2]}」`);
      }
      if (!t.startsWith('@') && !t.startsWith('#') && /\s(if|set):\S/.test(t))
        bad(n, no, '旁白行不吃 if:／set:，會整串印在畫面上');

      if (t.startsWith('@choice ')) {
        const txt = t.slice(8).split(/\s+(?:set:|goto:|if:)/)[0];
        if (!txt.startsWith('"') && txt.includes(' '))
          bad(n, no, '選項文字有半形空格，畫面上會被截斷（用半形引號包起來）', true);
      }
      // @char 叫了沒註冊的角色 → 那個人不會出現在畫面上
      const ch = t.match(/^@char (\S+)/);
      if (ch && ASSETS && ASSETS.characters) {
        const id = ch[1].split('.')[0].split(',')[0];
        if (!ASSETS.characters.includes(id))
          bad(n, no, '角色「' + id + '」沒有註冊，這行叫不出人來');
      }

      // Naninovel 的 BGM 會疊著放：只下 @bgm 不會停掉正在放的那首。
      if (/^@bgm\s/.test(t)) {
        let stopped = false;
        for (let k = i - 1; k >= 0; k--) {
          const prev = s.lines[k].trim();
          if (!prev) continue;
          stopped = /^@stopBgm/i.test(prev);
          break;
        }
        if (!stopped)
          bad(n, no, '前面沒有 @stopBgm：這首會跟正在放的那首疊在一起', true);
      }

      // 戰鬥會把音樂換成 battle01，而且打完不會還原（CombatSystem.cs）。
      // 所以戰鬥前一刻設的 BGM 是白設的，戰鬥後如果沒重設，battle01 會一直放下去。
      if (/^@battle\b/.test(t)) {
        for (let k = i - 1; k >= 0 && k >= i - 4; k--) {
          const prev = s.lines[k].trim();
          if (!prev || prev.startsWith(';')) continue;
          if (/^@bgm\s/.test(prev))
            bad(n, k + 1, '這行 BGM 會被戰鬥蓋掉。要指定戰鬥音樂請用 @battle 的 bgm: 參數', true);
          if (!prev.startsWith('@')) break;
        }
        const label = (t.match(/label:("[^"]*"|\S+)/) || [])[1];
        if (label) {
          const want = '#' + label.replace(/"/g, '');
          const at = s.lines.findIndex(l => l.trim().replace(/\s+/g, '') === want);
          if (at >= 0 && !resumesBgm(n, at + 1, labels))
            bad(n, at + 1, '戰鬥回來這裡沒有重設 BGM，battle01 會一直放下去', true);
        }
      }

      // 表情打錯 → 遊戲裡不會換臉，但也不會報錯，很難發現
      if (ASSETS && ASSETS.expressions) {
        for (const m of t.matchAll(/(?:^|@char )([^\s:@#,]+)\.([^\s:,]+)\s*[:\s]/g)) {
          const list = ASSETS.expressions[m[1]];
          if (!list) continue;
          if (list.includes(m[2])) continue;
          const near = list.find(x => x.toLowerCase() === m[2].toLowerCase());
          bad(n, no, near
            ? '表情大小寫不對：「' + m[2] + '」應該是「' + near + '」'
            : '「' + m[1] + '」沒有「' + m[2] + '」這個表情（有的是：' + list.join('、') + '）');
        }
      }

      const w = t.match(/affinity_(\w+)=affinity_(\w+)\+/);
      if (w && w[1] !== w[2]) bad(n, no, `加錯人了：affinity_${w[1]} 被設成 affinity_${w[2]} 的值`);
    });

    // 選項群組後面要有 @stop
    for (let i = 0; i < s.lines.length; i++) {
      if (!s.lines[i].trim().startsWith('@choice')) continue;
      let j = i, found = false;
      while (j < s.lines.length) {
        const t = s.lines[j].trim();
        if (t.startsWith('@stop')) {found = true; break}
        if (t && !t.startsWith('@') && !t.startsWith(';')) break;
        j++;
      }
      if (!found) bad(n, i + 1, '這組選項後面沒有 @stop，劇本會直接往下衝過去');
      i = j;
    }
  }
  issues.sort((a, b) => (a.warn - b.warn) || a.file.localeCompare(b.file) || a.line - b.line);
}
function bad(file, line, msg, warn) {issues.push({file, line, msg, warn: !!warn})}

// ── 畫面 ──────────────────────────────────────────────
// ── 腳本排序 ────────────────────────────────────────
// 照玩的順序排：主線 → 地圖 → 結局 → 系統 → 測試備份。
// 純字母排的話 badend 會跑到最上面、chapter6red 夾在 chat 中間，很難找。
const STORY = ['chapter0', 'chapter1', 'chapter2', 'chapter3', 'chapter4',
               'chapter4green', 'chapter4red', 'chapter5', 'chapter5common',
               'chapter5blue', 'chapter5red', 'chapter5yellow', 'chapter6red'];

function groupOf(n) {
  if (/^(demo|Test$|MainStory_Test|111|222|datetest|test_)/.test(n) || /備份/.test(n))
    return [8, '測試與備份'];
  if (STORY.includes(n)) return [0, '主線'];
  if (/^chapter/.test(n)) return [0, '主線'];
  if (/_day\d+$/.test(n)) return [1, '地圖：白天約會'];
  if (/^(blue|red|green|yellow)\d+$/.test(n)) return [2, '地圖：夜晚儀式'];
  if (/clue\d+$/.test(n) || /^chat_/.test(n) || /farewell|guidance/.test(n))
    return [3, '地圖：其他事件'];
  if (/^badend|_end$/.test(n)) return [4, '結局'];
  if (/^(title|System_UI|dreams)$/.test(n)) return [6, '系統'];
  return [5, '其他'];
}

// 同一組裡面：主線照劇情順序，其餘照名字（數字要當數字比，不然 10 會排在 2 前面）
function scriptOrder(a, b) {
  const ga = groupOf(a), gb = groupOf(b);
  if (ga[0] !== gb[0]) return ga[0] - gb[0];
  if (ga[0] === 0) {
    const ia = STORY.indexOf(a), ib = STORY.indexOf(b);
    if (ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  }
  return a.localeCompare(b, 'zh-Hant', {numeric: true});
}

function renderList() {
  const bad = issues.filter(i => !i.warn).length;
  const badge = document.getElementById('badge-issues');
  if (badge) { badge.textContent = bad || ''; badge.className = 'badge' + (bad ? ' on' : ''); }

  // 有沒存的就在搜尋框下面擺一顆「存全部」
  const box = document.getElementById('saveall');
  if (box) box.innerHTML = dirty.size
    ? '<button onclick="saveAll()">存全部（' + dirty.size + ' 支）</button>' : '';

  const q = document.getElementById('q').value.trim();
  const el = document.getElementById('list');
  el.innerHTML = '';
  let lastGroup = null;
  Object.keys(scripts).sort(scriptOrder).forEach(n => {
    const s = scripts[n];
    if (q && !n.includes(q) && !s.lines.some(l => l.includes(q))) return;
    const g = groupOf(n)[1];
    if (g !== lastGroup) {
      lastGroup = g;
      const h = document.createElement('div');
      h.className = 'sec'; h.textContent = g;
      el.appendChild(h);
    }
    const errs = issues.filter(i => i.file === n && !i.warn).length;
    const ends = s.lines.filter(l => l.trim().startsWith('@achieve')).length;
    const div = document.createElement('div');
    div.className = 'file' + (n === current ? ' sel' : '') + (dirty.has(n) ? ' undone' : '');
    div.innerHTML = '<span class="n">' + (dirty.has(n) ? '<b class="dot">●</b>' : '') + esc(n) +
      '</span><span class="m">' + (errs ? '<span class="err">✕' + errs + '</span> ' : '') +
      (ends ? '結局' + ends + ' ' : '') + s.lines.length + '行</span>';
    div.onclick = () => select(n);
    el.appendChild(div);
  });
}

// 點左邊的腳本就是要編它，一律進場景頁
function select(n) {
  current = n;
  tab = 'scenes';
  syncTabs();
  renderList();
  render();
}

// 把上面兩顆按鈕跟左邊的全域頁標成目前這個
function syncTabs() {
  document.querySelectorAll('#viewtabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === tab));
  document.querySelectorAll('.pages .pg').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === tab));
  document.getElementById('viewtabs').style.display =
    (tab === 'scenes' || tab === 'outline') ? '' : 'none';
}

// 切回這個分頁就順手做兩件事：對一下目前這支腳本，
// 以及看看編輯器本身有沒有被重新產生過（你開著的可能是舊程式）。
window.addEventListener('focus', async () => {
  if (!location.protocol.startsWith('http')) return;
  if (current && await refreshFromDisk(current)) { check(); render(); }
  checkBuild();
});

async function checkBuild() {
  if (!BUILD) return;
  const res = await fetch('/build').then(r => r.json()).catch(() => null);
  if (!res || !res.ok || !res.build || res.build === BUILD) return;
  if (document.getElementById('newbuild')) return;
  const bar = document.createElement('div');
  bar.id = 'newbuild';
  bar.innerHTML = '編輯器有更新（你開著的是舊版）　' +
    '<button onclick="location.reload(true)">重新整理</button>' +
    '<span onclick="this.parentNode.remove()">×</span>';
  document.body.appendChild(bar);
}

window.addEventListener('beforeunload', e => {
  if (!dirty.size) return;
  e.preventDefault(); e.returnValue = '';
});

document.getElementById('q').addEventListener('input', renderList);
document.querySelectorAll('#viewtabs button, .pages .pg').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  syncTabs();
  render();
});

function render() {
  const v = document.getElementById('view');
  renderList();                    // 左邊的未存標記和「存全部」跟著更新
  setTimeout(() => {                       // 重畫會把 .on 洗掉，畫完再標一次
    const a = document.getElementById('player');
    markPlaying(a && !a.paused ? a.dataset.name : null);
  }, 0);
  if (tab === 'issues') return renderIssues(v);
  if (tab === 'affinity') return renderAffinity(v);
  if (tab === 'endings') return renderEndings(v);
  if (tab === 'scenes') return renderScenes(v);
  if (tab === 'assets') return renderAssets(v);
  renderOutline(v);
}

function renderOutline(v) {
  const s = scripts[current];
  if (!s) return v.innerHTML = '<div class="empty">左邊選一支腳本</div>';
  const blocks = parse(s);
  v.innerHTML = `<h2>${s.name}</h2><div class="sub">${s.lines.length} 行、${blocks.length} 個段落。點藍色的跳轉可以直接過去。</div>` +
    blocks.map(b => `
      <div class="block">
        <div class="t" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'':'none'">
          <span># ${esc(b.label)}</span><span class="c">${b.line} 行　${b.items.length ? b.items.length + ' 項　' : ''}台詞 ${b.talk}</span>
        </div>
        <div class="b">${b.items.length ? b.items.map(it => `
          <div class="row">
            <span class="ln">${it.line}</span>
            <span class="tag t-${it.kind}">${kindName(it.kind)}</span>
            <span class="${it.jump ? 'jump' : 'txt'}" ${it.jump ? `onclick="goJump('${it.jump}')"` : ''}>${esc(it.text)}</span>
          </div>`).join('') : `<div class="row"><span class="ln"></span><span class="txt">${esc(b.first)}</span></div>`}</div>
      </div>`).join('');
}
const kindName = k => ({choice:'選項', goto:'跳轉', aff:'好感', end:'結局', battle:'戰鬥', map:'地圖'})[k] || k;

function goJump(target) {
  if (target.includes('.')) {
    const [file, lab] = target.split('.');
    if (scripts[file]) {select(file); setTimeout(() => scrollTo(lab), 60); return}
  }
  scrollTo(target);
}
function scrollTo(label) {
  [...document.querySelectorAll('.block > .t > span:first-child')]
    .find(e => e.textContent.trim() === '# ' + label)
    ?.scrollIntoView({behavior:'smooth', block:'center'});
}

function renderIssues(v) {
  const errs = issues.filter(i => !i.warn), warns = issues.filter(i => i.warn);
  v.innerHTML = `<h2>檢查</h2><div class="sub">錯誤 ${errs.length} 個、提醒 ${warns.length} 個。錯誤會讓劇本跑不動，提醒不會。</div>` +
    (issues.length ? issues.map(i => `
      <div class="issue ${i.warn ? 'warn' : ''}">
        <div>${esc(i.msg)}</div>
        <div class="w"><span class="jump" onclick="select('${i.file}')">${i.file}</span>　第 ${i.line} 行</div>
      </div>`).join('') : '<div class="empty">沒有問題。</div>');
}

function renderAffinity(v) {
  const rows = [];
  for (const n in scripts) {
    const sum = {};
    scripts[n].lines.forEach(l => {
      for (const m of l.matchAll(/affinity_(\w+)=affinity_\1\+(\d+)/g))
        sum['affinity_' + m[1]] = (sum['affinity_' + m[1]] || 0) + (+m[2]);
      for (const m of l.matchAll(/@set affinity_(\w+)=(\d+)\s*$/g))
        sum['affinity_' + m[1]] = `設為 ${m[2]}`;
    });
    if (Object.keys(sum).length) rows.push([n, sum]);
  }
  v.innerHTML = `<h2>好感總覽</h2><div class="sub">每支腳本裡各角色的加值合計（選項是「全部都選」的合計，實際只會拿到其中一條）。</div>` +
    rows.map(([n, sum]) => `<div class="block"><div class="t"><span>${n}</span></div><div class="b">` +
      Object.entries(sum).map(([k, val]) =>
        `<div class="row"><span class="tag t-aff">${CHAR[k] || k}</span><span class="txt">${
          typeof val === 'number' ? '＋' + val : val}</span></div>`).join('') +
      `</div></div>`).join('');
}

function renderEndings(v) {
  const rows = [];
  for (const n in scripts)
    scripts[n].lines.forEach((l, i) => {
      const m = l.trim().match(/@achieve\s+id:(\S+)/);
      if (m) rows.push({id: m[1], file: n, line: i + 1});
    });
  rows.sort((a, b) => a.id.localeCompare(b.id));
  v.innerHTML = `<h2>結局</h2><div class="sub">全部的 @achieve，共 ${rows.length} 處。</div>` +
    rows.map(r => `<div class="row"><span class="tag t-end">${r.id}</span>
      <span class="jump" onclick="select('${r.file}')">${r.file}</span>
      <span class="txt">第 ${r.line} 行</span></div>`).join('');
}


// ── 場景：把一支腳本攤成一連串畫面，而且可以拖 ──────────
// 逐行模擬 @back / @bgm / @char / @hide，每次「背景或在場的人變了」就切一張卡。
// 每個名牌記著它是哪一行 @char 生出來的，所以拖動時改得回那一行。
let dirty = new Set();

function sceneShots(sc) {
  const shots = [];
  let back = null, bgm = null, actors = new Map(), pending = false,
      firstLine = 1, talks = [], events = [], lastCmd = 1, label = '',
      backLine = 0, bgmLine = 0, lastBgm = null, ownBack = false, ownBgm = false,
      talked = false, prevIds = new Set();

  const flush = () => {
    if (!pending) return;
    // 只有換景／換曲、沒有台詞也沒有指令的一幕，不要自己佔一張卡——
    // 它的狀態（背景、曲子、誰在台上）留給下一幕，看起來就是同一格。
    if (!talks.length && !events.length) { pending = false; return; }
    shots.push({back, bgm, label,
      backLine, bgmLine, bgmChanged: bgm !== lastBgm, ownBack, ownBgm,
      // 這一幕才上場的人：拿掉他們是刪 @char，其餘是插 @hide
      fresh: [...actors.keys()].filter(id => !prevIds.has(id)),
      // 依站位排序：名牌的陣列順序＝畫面上的左右順序，槽位判定才對得起來
      actors: [...actors.entries()]
        .map(([id, a]) => [id, a.pos, a.line, a.app || '', a.jumpedLabel || ''])
        .sort((x, y) => x[1] - y[1]),
      line: firstLine, insertAt: lastCmd, talks, events,
      talk: talks.length ? talks[0].text : ''});
    lastBgm = bgm;
    prevIds = new Set(actors.keys());
    pending = false; talks = []; events = []; talked = false;
    ownBack = false; ownBgm = false;
  };

  // 一幕＝從這次畫面變動到下一次畫面變動。中間講的話全部留著，
  // 之前只留第一句，等於九成的劇本在這一頁是看不到的。
  const change = no => {
    if (talked) flush();          // 已經開始講話了才切幕，不然連續的 @char 會被拆成好幾張卡
    if (!pending) { firstLine = no; pending = true; }
    lastCmd = no;
  };

  // 白名單會漏掉之後新增的指令，所以反過來：只有純節奏用的才不顯示。
  const SKIP = /^(stop|wait|print|showUI|hidePrinter|stopSfx|stopsfx)$/i;

  sc.lines.forEach((raw, i) => {
    const t = raw.trim(), no = i + 1;
    if (t.startsWith(';')) return;
    if (!t) {                       // 空行：只有在一幕裡面才留著，新寫的台詞要看得到
      if (pending) { talks.push({line: no, text: '', who: '', app: ''}); talked = true; }
      return;
    }
    let m;
    if (t.startsWith('#')) {
      flush(); label = t.slice(1).trim();
      // 這裡是別處 @goto 跳得進來的地方。在場的人如果是更早宣告的，
      // 玩家從那邊跳進來時就不一定在台上——記一下，畫面上會標出來。
      actors.forEach(a => { if (!a.jumpedLabel) a.jumpedLabel = label; });
      return;
    }
    if ((m = t.match(/^@back (\S+)/))) {
      flush(); back = m[1].split(',')[0]; backLine = no; ownBack = true;
      firstLine = no; lastCmd = no; pending = true;
    }
    else if ((m = t.match(/^@bgm (\S+)/))) { change(no); bgm = m[1]; bgmLine = no; ownBgm = true; }
    // @stopBgm 也是這一幕自己的音樂設定，行號要留著——
    // 歸零的話換曲會找不到要改哪一行，之前會插到檔案最前面去。
    else if (/^@stopBgm/i.test(t)) { change(no); bgm = null; bgmLine = no; ownBgm = true; }
    else if ((m = t.match(/^@char (\S+)/))) {
      change(no);
      const tok = m[1].split(',')[0];
      const id = tok.split('.')[0], app = tok.includes('.') ? tok.split('.')[1] : null;
      const p = t.match(/pos:([\d.]+)/);
      const before = actors.get(id);
      // 表情跟站位一樣，沒寫就是延續上一次的
      actors.set(id, {pos: p ? Math.round(+p[1]) : (before ? before.pos : 50),
                      line: no, app: app !== null ? app : (before ? before.app : ''),
                      jumpedLabel: ''});
    }
    else if ((m = t.match(/^@hide (\S+)/))) {
      change(no);
      m[1].split(',').forEach(x => actors.delete(x.trim().split('.')[0]));
    }
    else if (/^@hideChars/.test(t)) { change(no); actors.clear(); }
    else if ((m = t.match(/^@(\w+)/))) {
      // 其他指令不切幕，但要留在這一幕的紀錄裡——選項、跳轉、戰鬥都在這裡
      if (SKIP.test(m[1])) return;
      if (!pending) { firstLine = no; pending = true; }
      events.push({line: no, kind: m[1], text: t});
    }
    else {
      // 表情多半寫在說話者那一行（「優菲.bling: ……」），不是寫在 @char。
      // 這也是畫面變動，所以要另起一幕，不然舞台上會一路是預設表情。
      const sp = t.match(/^([^\s:@#]+?)(?:\.([^\s:]+))?\s*:/);
      if (sp && sp[2] && actors.has(sp[1])) {
        // 只更新她現在的表情，不另起一幕——表情是逐句的東西，
        // 每換一次就切一張卡的話，一段對話會被剁成好幾格，很難讀。
        // 每一句旁邊本來就有表情選單，看得到也改得到。
        const a = actors.get(sp[1]);
        actors.set(sp[1], {pos: a.pos, line: a.line, app: sp[2]});
      }
      talks.push({line: no, text: t, who: sp ? sp[1] : '', app: sp ? (sp[2] || '') : ''});
      talked = true;
      if (!pending) { firstLine = no; pending = true; }
    }
  });
  flush();
  return shots;
}

// 專案裡出現過的角色 id，拿來當調色盤

// 這個名牌能有多寬：取左右鄰居距離的一半再留點縫，最寬 32%
function gapAt(actors, i) {
  const p = actors[i][1];
  const left = i > 0 ? p - actors[i - 1][1] : 100;
  const right = i < actors.length - 1 ? actors[i + 1][1] - p : 100;
  return Math.max(12, Math.min(32, Math.floor(Math.min(left, right) * 0.9)));
}

// 跳到那一行所在的那一幕
function goUse(file, line) {
  select(file);                       // select 會切到場景頁
  setTimeout(() => {

    let idx = shots.findIndex((s, i) =>
      s.line <= line && (i === shots.length - 1 || shots[i + 1].line > line));

// ── 戰鬥與地圖的編號 ──────────────────────────────
// 「本章第幾個」好算；「全遊戲第幾個」要有路線才算得出來，
// 所以用腳本之間的 @goto 建一張圖，從 chapter0 走最短路徑過來，
// 把路上經過的腳本裡的戰鬥／地圖全部加起來。
// 走不到的（demo、備份、單獨的地圖事件）就只給本章編號。
let ROUTE = null;

function isBattle(t) { return /^@battle\b/.test(t); }
function isMap(t) { return /^@Goto(UnityScene|MapDemo)\b/.test(t) && /MapTest/.test(t); }

function routeInfo() {
  if (ROUTE) return ROUTE;
  const edges = {}, count = {};

  for (const n in scripts) {
    edges[n] = new Set();
    count[n] = {battle: 0, map: 0};
    scripts[n].lines.forEach(l => {
      const t = l.trim();
      if (isBattle(t)) count[n].battle++;
      else if (isMap(t)) count[n].map++;
      // 跳去別支腳本有三種寫法：@goto chapter1（整支）、
      // @goto syb_end.end1（跳到某段）、還有地圖回來用的 scriptName/script
      for (const re of [/(?:@goto |goto:)([\w-]+)(?=[.\s]|$)/g,
                        /(?:scriptName|script):"?([\w-]+)/g])
        for (const m of t.matchAll(re))
          if (m[1] !== n && !t.startsWith('@goto .')) edges[n].add(m[1]);
    });
  }

  // 從 chapter0 出發，記下每支腳本是「經過哪些腳本」才到得了的
  const before = {chapter0: {battle: 0, map: 0}}, seen = new Set(['chapter0']);
  const queue = ['chapter0'];
  while (queue.length) {
    const cur = queue.shift();
    for (const nx of edges[cur] || []) {
      if (seen.has(nx) || !scripts[nx]) continue;
      seen.add(nx);
      before[nx] = {battle: before[cur].battle + count[cur].battle,
                    map: before[cur].map + count[cur].map};
      queue.push(nx);
    }
  }
  return (ROUTE = {before, count});
}

// 這一行是這支腳本裡的第幾個戰鬥／地圖，以及全遊戲第幾個
function battleTag(line, kind) {
  const sc = scripts[current], {before} = routeInfo();
  const test = kind === 'battle' ? isBattle : isMap;
  let inChapter = 0;
  for (let i = 0; i < line; i++) if (test(sc.lines[i].trim())) inChapter++;

  const what = kind === 'battle' ? '戰鬥' : '進地圖';
  const b = before[current];
  return '<span class="cnt">本章第 ' + inChapter + ' 個' + what +
    (b ? '　全遊戲第 ' + (b[kind] + inChapter) + ' 個'
       : '　<i title="從 chapter0 一路 @goto 走不到這支腳本，所以算不出全遊戲的編號">支線</i>') +
    '</span>';
}

// ── 資源清單 ──────────────────────────────────────
// 有哪些背景、音樂、怪物、角色跟表情，一頁看完。
// 順便標出劇本裡用到、但檔案找不到的（那些在遊戲裡會是黑畫面或沒聲音）。
function usedIn(re) {
  const used = {};
  for (const n in scripts)
    scripts[n].lines.forEach((l, i) => {
      const m = l.trim().match(re);
      if (m) (used[m[1]] = used[m[1]] || []).push(n + ':' + (i + 1));
    });
  return used;
}

// 浮動播放器：貼在右下角，換分頁、捲到哪裡都在，
// 一邊看劇本一邊確認配樂用的。整個網頁共用這一台。
function player() {
  let el = document.getElementById('floatplayer');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'floatplayer';
  const kind = (ASSETS && ASSETS.audioKind) || {};
  const list = ASSETS ? Object.keys(ASSETS.audio) : [];
  const group = (label, want) => {
    const items = list.filter(n => (kind[n] === 'sfx') === want).sort();
    return items.length ? '<optgroup label="' + label + '">' +
      items.map(n => '<option>' + esc(n) + '</option>').join('') + '</optgroup>' : '';
  };

  el.innerHTML =
    '<div class="pn"><b id="pname">—</b>' +
      '<span class="px" title="關掉" onclick="stopBgm()">×</span></div>' +
    '<select id="ppick" title="直接挑一首來聽" onchange="pickBgm(this.value)">' +
      '<option value="">選一首…</option>' + group('音樂', false) + group('音效', true) +
    '</select>' +
    '<audio id="player" controls preload="none"></audio>' +
    '<div class="pf">' +
      '<button class="pb" title="上一首" onclick="stepBgm(-1)">◀</button>' +
      '<button class="pb" title="下一首" onclick="stepBgm(1)">▶</button>' +
      '<label class="pl"><input type="checkbox" id="ploop"> 循環</label>' +
    '</div>';
  document.body.appendChild(el);
  const a = el.querySelector('#player');
  a.volume = 0.5;                  // 突然全音量嚇人
  a.addEventListener('ended', () => {
    if (document.getElementById('ploop').checked) { a.currentTime = 0; a.play(); }
    else markPlaying(null);
  });
  return el;
}

// 正在播的那顆按鈕標起來（換分頁重畫之後也要重標）
function markPlaying(name) {
  document.querySelectorAll('.play').forEach(b =>
    b.classList.toggle('on', b.dataset.name === name));
}

function stopBgm() {
  const a = document.getElementById('player');
  if (a) { a.pause(); a.removeAttribute('src'); a.load(); }
  const el = document.getElementById('floatplayer');
  if (el) el.classList.remove('show');
  markPlaying(null);
}

// 從浮動面板直接挑曲
function pickBgm(name) {
  if (!name || !ASSETS) return;
  playBgm(ASSETS.audio[name], name, null);
}

// 上一首／下一首，照面板選單的順序走（音樂在前、音效在後）
function stepBgm(dir) {
  const sel = document.getElementById('ppick');
  if (!sel) return;
  const names = [...sel.options].map(o => o.value).filter(Boolean);
  if (!names.length) return;
  const a = document.getElementById('player');
  const i = names.indexOf(a && a.dataset.name);
  pickBgm(names[(i + dir + names.length) % names.length]);
}

// 一次只留一台播放器。67 首各擺一個 <audio> 的話，
// 光是瀏覽器去要每首的長度就會把連線塞爆。
function playBgm(src, name, btn) {
  const el = player(), a = document.getElementById('player');
  el.classList.add('show');
  if (a.dataset.name === name && !a.paused) { a.pause(); markPlaying(null); return; }
  if (a.dataset.name !== name) { a.src = src; a.dataset.name = name; }
  document.getElementById('pname').textContent = name;
  const sel = document.getElementById('ppick');
  if (sel) sel.value = name;
  a.play();
  markPlaying(name);
}

const playBtn = (n, src) => '<button class="play" data-name="' + esc(n) +
  '" onclick="playBgm(&quot;' + esc(src) + '&quot;, &quot;' + esc(n) + '&quot;, this)">▶ ' +
  esc(n) + '</button>';

    '<div class="ass' + (used && !used[name] ? ' unused' : '') +

        '&quot;)" title="點一下看用在哪裡' : '') + '">' + inner +

      'backgrounds') +

    sec('音樂（BGM）', bgmList.length + ' 首，寫成 <code>@bgm 名字</code>。按 ▶ 試聽。',
      missing(usedBgm, ASSETS.audio, '音樂') +

        card(n, playBtn(n, src), usedBgm)).join('') + '</div>') +

    sec('音效（SE）', sfxList.length + ' 個，寫成 <code>@sfx 名字</code>。' +

    sec('怪物', Object.keys(ASSETS.monsters || {}).length + ' 隻。@battle 的 target 就是這些名字。',
      missing(usedMob, ASSETS.monsters || {}, '怪物') +

        card(n, '<img loading="lazy" class="mob" src="' + src + '">', usedMob, '', 'monsters')).join('') + '</div>',
      'monsters') +

    imgSection('符文卡', 'runeCards', '戰鬥中的符文卡面。') +
    imgSection('路人女巫', 'witches', '背景角色、卡面、換裝。') +
    imgSection('連段', 'combo', '連段演出圖。') +
    imgSection('教學', 'tutorial', '教學場景用的圖與說明板。') +

    sec('角色與表情',
      '角色是 Live2D，沒有立繪可以預覽——圖是 prefab 旁邊的貼圖集，只能當個示意。' +

    '<div class="empty">場景預覽需要「已載入」的版本。<br>在專案根目錄跑：python tools/build_viewer.py</div>';

  const shots = sceneShots(sc);
  const backNames = Object.keys(ASSETS.backgrounds).sort();
  // 換場景配樂的選單只列 BGM。26 個音效混進來會變成一長串，反而難挑
  const bgmNames = Object.keys(ASSETS.audio)
    .filter(n => (ASSETS.audioKind || {})[n] !== 'sfx').sort();

  const opts = (list, sel) => list.map(x =>
    '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>').join('');

  v.innerHTML =
    '<div id="bar">' +
      '<b>' + esc(sc.name) + '</b>' +
      '<span class="txt">' + shots.length + ' 個畫面</span>' +
      (blankCount(sc) ? '<button onclick="dropBlanks()" title="這支腳本裡的空行，' +
        '在遊戲裡沒有作用，只是讓編輯畫面變得零零落落">清掉空行（' + blankCount(sc) + '）</button>' : '') +
      (dirty.has(sc.name)
        ? '<span class="dirty">● 有未存的變更</span>' +
          '<button class="undo" onclick="revertScript()"' +
          ' title="把這支腳本丟回上次存檔的樣子，這次的修改全部不要">取消變更</button>'
        : '') +
      (canSave ? '<button class="save" onclick="saveScript()">存回 .nani</button>'
               : '<span class="txt">（唯讀。要能存檔就跑 python tools/serve.py）</span>') +
      '<span class="txt" style="margin-left:auto">拖名牌換順序　把角色拖進畫面加人</span>' +
      '<div style="flex-basis:100%;height:0"></div>' +
      allActors().map(a =>
        '<span class="chip" draggable="true" data-id="' + esc(a) + '">' + esc(a) + '</span>').join('') +
    '</div>' +
    '<div class="scenes">' + shots.map(s => {
      const src = ASSETS.backgrounds[s.back] ||
                  (s.back ? ASSETS.backgrounds[s.back.split('.')[0]] : null);
      const audio = ASSETS.audio[s.bgm];

      return '<div class="scene' + (s.bgmChanged ? ' bgmchanged' : '') + '">' +
        '<div class="stage" data-insert="' + s.insertAt + '" data-line="' + s.line + '">' +
        (src ? '<img loading="lazy" src="' + src + '">'
             : '<div class="noimg">' + (s.back ? '找不到背景　' + esc(s.back) : '（沒有指定背景）') + '</div>') +
        s.actors.map(([id, pos, line, app, jumped], i) =>
          // 人越多名牌越窄，這樣才不會互相蓋住又不用把它們排成階梯
          // 名牌寬度看的是左右鄰居離多遠，不是人數——
          // 兩個人站 40/60 也會擠，人數少不代表寬得下
          '<div class="actor' + (gapAt(s.actors, i) < 24 ? ' tight' : '') +
          '" style="left:' + pos + '%;max-width:' + gapAt(s.actors, i) + '%" data-line="' + line +
          '" data-pos="' + pos + '" data-id="' + esc(id) + '">' +
          '<div class="card' + (jumped ? ' guess' : '') + '"><span class="nm" title="' + esc(id) +
            (jumped ? '　（她是第 ' + line + ' 行叫上場的，中間經過段落 #' + esc(jumped) +
              '。玩家如果是從那裡跳進來的，她其實不在台上——這裡只是照順序讀下來的推測）' : '') +
            '">' + esc(id) + (jumped ? '<i class="q">?</i>' : '') + '</span>' +
            '<span class="x" title="' + (s.fresh.includes(id)
              ? '這一幕才上場，拿掉＝刪掉那行 @char'
              : '她是前面就在場的，拿掉＝在這一幕插一行 @hide') + '"' +
            ' onpointerdown="event.stopPropagation()"' +
            ' onclick="removeActor(&quot;' + esc(id) + '&quot;,' + line + ',' +
            s.fresh.includes(id) + ',' + s.line + ')">×</span>' +
          '</div>' +
          '<div class="pos' +
            (s.actors.filter(o => Math.abs(o[1] - pos) < 6).length > 1 ? ' clash' : '') +
            '" title="左邊數來第 ' + (i + 1) + ' 位' +
            (s.actors.filter(o => Math.abs(o[1] - pos) < 6).length > 1
              ? '。這一幕有人站在同一個位置，遊戲裡會疊在一起' : '') + '">pos ' + pos +
            (app ? '　' + esc(EXPR_ZH[app] || app) : '') + '</div>' +
            exprPicker(id, app, line, s.line) + '</div>').join('') +
        '</div>' +

        '<div class="bar">' +
          '<span class="ln">' + s.line + ' 行</span>' +
          (s.label ? '<span class="lab" title="這一幕落在哪個段落裡（@goto 跳轉的目標）">段落 # ' +
            esc(s.label) + '</span>' : '') +
          (s.actors.length && !isCanonical(s.actors)
            ? '<button onclick="applySlots(' +
              JSON.stringify(s.actors).replace(/"/g, '&quot;') + ', ' + s.line + ')"' +
              ' title="這一幕的站位不合慣例（現在是 ' + s.actors.map(a => a[1]).join('/') +
              '）。按了會照現在的左右順序拉回等分站位，順序不變">站位 → ' +
              slotsFor(s.actors.length).join('/') + '</button>' : '') +
          '<select class="pick' + (s.ownBack ? '' : ' inherit') + '"' +
            ' title="' + (s.ownBack ? '換掉這一幕的背景'
                                    : '這一幕沿用前面的背景。選了會插一行 @back，從這裡開始換景') + '"' +
            ' onchange="setBack(' + (s.ownBack ? s.backLine : 0) + ', ' +
            (s.ownBack ? 0 : s.line) + ', this.value)">' +
            (s.ownBack ? '' : '<option value="">沿用 ' + esc(s.back || '—') + '</option>') +
            (s.back && !backNames.includes(s.back) ? '<option selected>' + esc(s.back) + '</option>' : '') +
            opts(backNames, s.ownBack ? s.back : null) + '</select>' +
          '<select class="pick' + (s.bgmChanged ? ' hot' : '') + '"' +
            ' title="' + (s.ownBgm ? '換掉這一幕的曲子' : '選了會在這一幕插一行 @bgm，從這裡開始換曲') + '"' +
            ' onchange="setBgm(' + (s.ownBgm ? s.bgmLine : 0) + ', ' + s.line + ', this.value)">' +
            '<option value="">' + (s.ownBgm ? (s.bgm ? '（不換）' : '（這裡停掉音樂）')
                                              : '沿用 ' + (s.bgm || '無聲')) + '</option>' +
            (s.bgm && !bgmNames.includes(s.bgm) ? '<option selected>' + esc(s.bgm) + '</option>' : '') +
            opts(bgmNames, s.bgm) + '</select>' +
          (s.bgmChanged ? '<span class="newbgm">♪ 換曲</span>' : '') +
          (audio ? playBtn(s.bgm, audio) : '') +
        '</div>' +
        (s.talks.length ? '<div class="lines">' + s.talks.map(x =>
            '<div><span class="ln">' + x.line + '</span>' +
            talkExpr(x) +
            '<span class="edit" contenteditable="true" spellcheck="false" data-line="' + x.line + '"' +
            ' onblur="editLine(' + x.line + ', this)"' +
            ' onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();this.blur()}' +
            'if(event.key===&quot;Escape&quot;){this.textContent=this.dataset.was;this.blur()}"' +
            ' onfocus="this.dataset.was=this.textContent">' + esc(x.text) + '</span>' +
            (x.text ? '' : '<span class="blank">（空行）</span>') +
            '<span class="dx" title="刪掉這一行" onclick="delLine(' + x.line + ')">×</span>' +
            '</div>').join('') +
          '</div>' : '') +
        (s.events.length ? '<div class="evs">' + s.events.map(x =>
            '<div><span class="ln">' + x.line + '</span><span class="tag t-' + x.kind + '">' +
            (EVENT_NAME[x.kind] || x.kind) + '</span>' +
            (x.kind === 'battle' ? battleTag(x.line, 'battle') + battleBgmPicker(x) + esc(x.text)
              : (x.kind === 'GotoUnityScene' || x.kind === 'GotoMapDemo') && /MapTest/.test(x.text)
                ? battleTag(x.line, 'map') + esc(x.text)
              : x.kind === 'choice' ? choiceRow(x)
              : x.kind === 'goto' ? gotoRow(x)
              : (x.kind === 'restroom' || x.kind === 'SaveReturnPoint' ||
                 x.kind === 'GotoChangeRune') ? targetRow(x) : esc(x.text)) + '</div>').join('') +
          '</div>' : '') +
        '<div class="addch">' +
          '<button onclick="addTalk(' + s.line + ')">＋ 台詞</button>' +
          '<button onclick="addChoice(' + s.insertAt + ')">＋ 選項</button>' +
          '<button onclick="addShot(' + s.line + ')" title="在這一幕後面另起一幕（換背景）">＋ 新的一幕</button>' +
          '<select class="more" onchange="addMore(' + s.line + ', this.value); this.value=&quot;&quot;">' +
            '<option value="">＋ 其他…</option>' +
            '<option value="label">段落（# 標籤，給 @goto 跳過來）</option>' +
            '<option value="goto">跳轉（@goto）</option>' +
            '<option value="map_day">進地圖：白天</option>' +
            '<option value="map_night">進地圖：夜晚</option>' +
          '</select>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';

  wireDragging();
}

// 這場仗放哪首。@battle 的 bgm: 參數沒寫就是預設的 battle01。
function battleBgmPicker(x) {
  if (!ASSETS) return '';
  const cur = (x.text.match(/bgm:("[^"]*"|\S+)/) || [])[1];
  const now = cur ? cur.replace(/"/g, '') : '';
  const kind = ASSETS.audioKind || {};
  const list = Object.keys(ASSETS.audio).filter(n => kind[n] !== 'sfx').sort();
  return '<select class="chgoto" title="這場戰鬥要放的音樂"' +
    ' onchange="setBattleBgm(' + x.line + ', this.value)">' +
    '<option value=""' + (now ? '' : ' selected') + '>battle01（預設）</option>' +
    list.map(n => '<option' + (n === now ? ' selected' : '') + '>' + esc(n) + '</option>').join('') +
    '</select>';
}

function setBattleBgm(line, name) {
  const sc = scripts[current];
  let l = sc.lines[line - 1];
  l = l.replace(/\s*bgm:("[^"]*"|\S+)/, '');
  if (name) l = l.trimEnd() + ' bgm:' + name;
  sc.lines[line - 1] = l;
  dirty.add(sc.name); check(); render();
}

// 「去哪支腳本的哪個段落」——@restroom、@SaveReturnPoint、@GotoChangeRune
// 都是這個形狀，只是參數名字不一樣。做成兩個選單，不用背參數怎麼寫。
const TARGET_PARAM = {restroom: ['scriptName', 'label'],
                      SaveReturnPoint: ['script', 'label'],
                      GotoChangeRune: ['scriptName', 'label']};

function targetRow(x) {
  const [sp, lp] = TARGET_PARAM[x.kind];
  const g = v => {
    const m = x.text.match(new RegExp(v + ':("[^"]*"|[^ ]+)'));
    return m ? m[1].replace(/"/g, '') : '';
  };
  const script = g(sp), label = g(lp);
  const names = Object.keys(scripts).sort(scriptOrder);
  const labels = scripts[script] ? [...labelsOf(scripts[script])].sort() : [];

  return '<span class="ch">' +
    '<select class="chgoto" title="回到哪一支腳本"' +
      ' onchange="setTarget(' + x.line + ', &quot;' + x.kind + '&quot;, &quot;script&quot;, this.value)">' +
      (script ? '' : '<option value="">（沒寫，會留在原地）</option>') +
      names.map(n => '<option' + (n === script ? ' selected' : '') + '>' + esc(n) + '</option>').join('') +
    '</select>' +
    '<select class="chgoto" title="接到哪個段落"' +
      ' onchange="setTarget(' + x.line + ', &quot;' + x.kind + '&quot;, &quot;label&quot;, this.value)">' +
      (labels.includes(label) ? '' : '<option selected>' + esc(label || '（沒寫）') + '</option>') +
      labels.map(l => '<option' + (l === label ? ' selected' : '') + '>' + esc(l) + '</option>').join('') +
    '</select>' +
    (script && !scripts[script] ? '<span class="chraw">找不到這支腳本</span>' :
     script && label && !labels.includes(label) ? '<span class="chraw" style="color:#e0a0a8">'
       + esc(script) + ' 裡沒有這個段落</span>' : '') +
  '</span>';
}

function setTarget(line, kind, which, value) {
  const sc = scripts[current];
  const [sp, lp] = TARGET_PARAM[kind];
  const param = which === 'script' ? sp : lp;
  let l = sc.lines[line - 1];
  const re = new RegExp('(' + param + ':)("[^"]*"|[^ ]+)');
  const val = '"' + value + '"';
  // 換了腳本的話，原本的段落多半就不存在了，順手清掉免得指到不存在的地方
  if (which === 'script') l = l.replace(new RegExp('\\s' + lp + ':("[^"]*"|[^ ]+)'), '');
  l = re.test(l) ? l.replace(re, '$1' + val) : l.trimEnd() + ' ' + param + ':' + val;
  sc.lines[line - 1] = l;
  dirty.add(sc.name); check(); render();
}

// @goto 的目標改成選單，跟選項那邊一樣不用自己打
function gotoRow(x) {
  const m = x.text.match(/^@goto\s+(\S+)/);
  const target = m ? m[1] : '';
  if (target && !target.startsWith('.')) return esc(x.text);   // 跳去別支腳本的不動它
  const labels = [...labelsOf(scripts[current])].sort();
  return '<select class="chgoto" onchange="setGoto(' + x.line + ', this.value)">' +
    labels.map(l => '<option value=".' + esc(l) + '"' +
      (target === '.' + l ? ' selected' : '') + '>' + esc(l) + '</option>').join('') +
    '</select>';
}

function setGoto(line, target) {
  const sc = scripts[current];
  sc.lines[line - 1] = sc.lines[line - 1].replace(/^(\s*@goto\s+)\S+/, '$1' + target);
  dirty.add(sc.name); check(); render();
}

// 「＋ 其他」選單
function addMore(shotLine, what) {
  if (!what) return;
  const sc = scripts[current], at = shotEnd(shotLine);

  if (what === 'label') {
    const name = newLabel('new_label');
    sc.lines.splice(at, 0, '', '# ' + name);
  } else if (what === 'goto') {
    const first = [...labelsOf(sc)].sort()[0];
    if (!first) return alert('這支腳本還沒有任何段落，先加一個段落再跳。');
    sc.lines.splice(at, 0, '@goto .' + first);
  } else {
    // 進地圖是一整組：關音樂、記白天還是晚上、記回來要接哪裡、換場景、
    // 然後停住等地圖那邊叫回來，回來會落在下面那個段落。
    const isDay = what === 'map_day';
    const back = newLabel(isDay ? 'aftermap_day' : 'aftermap_night');
    sc.lines.splice(at, 0,
      '@stopBgm',
      '@saveMapDayNight isDay:' + isDay,
      '@SaveReturnPoint script:"' + sc.name + '" label:"' + back + '"',
      '@GotoUnityScene sceneName:MapTest',
      '@stop',
      '# ' + back,
      '');
  }
  dirty.add(sc.name); check(); render();
}

// 取一個沒被用過的段落名
function newLabel(base) {
  const used = labelsOf(scripts[current]);
  if (!used.has(base)) return base;
  for (let i = 2; ; i++) if (!used.has(base + i)) return base + i;
}

// ── 寫東西進去 ──────────────────────────────────────
// 這一幕的範圍：從第一行到下一幕開始之前
function shotEnd(shotLine) {
  const sc = scripts[current];
  const next = sceneShots(sc).find(s => s.line > shotLine);
  return next ? next.line - 1 : sc.lines.length;
}

// 加一句台詞。接在這一幕最後一句後面，說話者沿用上一句的，
// 這樣連著寫下去不用每次都打名字。
function addTalk(shotLine) {
  const sc = scripts[current];
  const shot = sceneShots(sc).find(s => s.line === shotLine);
  const last = shot && shot.talks.length ? shot.talks[shot.talks.length - 1] : null;
  const who = last ? (last.who || '') : '';
  const at = last ? last.line : shotEnd(shotLine);

  sc.lines.splice(at, 0, who ? who + ': ' : '');
  dirty.add(sc.name); check(); render();
  focusLine(at + 1);
}

// 另起一幕：插一行 @back（先沿用現在的背景）跟一句空台詞
function addShot(shotLine) {
  const sc = scripts[current];
  const shot = sceneShots(sc).find(s => s.line === shotLine);
  const at = shotEnd(shotLine);
  sc.lines.splice(at, 0, '@back ' + (shot && shot.back ? shot.back : 'bg01'), '');
  dirty.add(sc.name); check(); render();
  focusLine(at + 2);
}

// 新加的那一行捲過去、游標放進去，接著就能打字
function focusLine(line) {
  setTimeout(() => {
    const el = document.querySelector('.edit[data-line="' + line + '"]');
    if (!el) return;
    el.scrollIntoView({block: 'center'});
    el.focus();
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  }, 0);
}

// ── 選項 ──────────────────────────────────────────────
// @choice 文字 set:affinity_Eup=affinity_Eup+5 goto:.label
// 拆成「文字／加誰的好感／加多少／跳到哪」四格，不用自己記語法。
function parseChoice(t) {
  const body = t.replace(/^@choice\s+/, '');
  const g = body.match(/\sgoto:(\S+)/);
  const st = body.match(/\sset:(\S+)/);
  const iff = body.match(/\sif:(\S+)/);
  let text = body.split(/\s+(?:set:|goto:|if:)/)[0].trim();
  const quoted = /^".*"$/.test(text);
  if (quoted) text = text.slice(1, -1);
  const aff = st ? st[1].match(new RegExp('^(affinity_\\w+)=\\1\\+(\\d+)$')) : null;
  return {text, quoted, goto: g ? g[1] : '',
          who: aff ? aff[1] : '', amount: aff ? aff[2] : '',
          rawSet: st && !aff ? st[1] : '', if: iff ? iff[1] : ''};
}

function buildChoice(c) {
  // 選項文字有半形空格一定要用引號包起來，不然畫面上會被截斷
  const text = (c.quoted || /\s/.test(c.text)) ? '"' + c.text + '"' : c.text;
  let out = '@choice ' + text;
  if (c.who && c.amount) out += ' set:' + c.who + '=' + c.who + '+' + c.amount;
  else if (c.rawSet) out += ' set:' + c.rawSet;
  if (c.if) out += ' if:' + c.if;
  if (c.goto) out += ' goto:' + c.goto;
  return out;
}

function choiceRow(x) {
  const c = parseChoice(x.text), sc = scripts[current];
  const labels = [...labelsOf(sc)].sort();
  const q = s => String(s).replace(/'/g, "\'");

  return '<span class="ch">' +
    '<input class="chtext" value="' + esc(c.text) + '" placeholder="選項文字"' +
      ' onchange="editChoice(' + x.line + ', &quot;text&quot;, this.value)">' +
    '<select class="chwho" title="選了加誰的好感"' +
      ' onchange="editChoice(' + x.line + ', &quot;who&quot;, this.value)">' +
      '<option value="">（不加好感）</option>' +
      Object.entries(CHAR).map(([k, v]) => '<option value="' + k + '"' +
        (k === c.who ? ' selected' : '') + '>' + v + '</option>').join('') +
    '</select>' +
    (c.who ? '<input class="chamt" type="number" step="5" value="' + esc(c.amount || 5) + '"' +
      ' title="加多少" onchange="editChoice(' + x.line + ', &quot;amount&quot;, this.value)">' : '') +
    '<select class="chgoto" title="選了跳到哪個段落"' +
      ' onchange="editChoice(' + x.line + ', &quot;goto&quot;, this.value)">' +
      '<option value="">（不跳，往下走）</option>' +
      (c.goto && !labels.includes(c.goto.replace(/^\./, '')) ?
        '<option selected value="' + esc(c.goto) + '">' + esc(c.goto) + '（別支腳本）</option>' : '') +
      labels.map(l => '<option value=".' + esc(l) + '"' +
        (c.goto === '.' + l ? ' selected' : '') + '>' + esc(l) + '</option>').join('') +
    '</select>' +
    (c.rawSet ? '<span class="chraw" title="這個 set 不是單純加好感，我不動它">set:' + esc(c.rawSet) + '</span>' : '') +
    (c.if ? '<span class="chraw" title="有條件才出現">if:' + esc(c.if) + '</span>' : '') +
    '<span class="x" title="刪掉這個選項" onclick="delChoice(' + x.line + ')">×</span>' +
  '</span>';
}

function editChoice(line, field, value) {
  const sc = scripts[current], c = parseChoice(sc.lines[line - 1].trim());
  if (field === 'who') {
    c.who = value;
    if (value && !c.amount) c.amount = 5;   // 沒填過就給個預設值
    if (!value) c.amount = '';
  } else c[field] = value;
  const indent = (sc.lines[line - 1].match(/^\s*/) || [''])[0];
  sc.lines[line - 1] = indent + buildChoice(c);
  dirty.add(sc.name); check(); render();
}

function delChoice(line) {
  const sc = scripts[current];
  sc.lines.splice(line - 1, 1);
  dirty.add(sc.name); check(); render();
}

// 加在這一幕最後一個 @choice 後面；沒有的話就加在這一幕的指令後面
function addChoice(insertAt) {
  const sc = scripts[current];
  let at = insertAt;
  while (at < sc.lines.length && /^\s*@choice/.test(sc.lines[at])) at++;
  sc.lines.splice(at, 0, '@choice 新的選項');
  dirty.add(sc.name); check(); render();
}

// 表情的中文說明。名字是 Live2D 的動作檔名，光看 blingloop、sighloop
// 想不起來是什麼臉，所以選單上兩個都顯示。loop 結尾的會一直循環播。
const EXPR_ZH = {
  idle:'待機（預設）', idle2:'待機 2', talk:'講話', talking:'講話', talkloop:'講話（循環）',
  happy:'開心', happy2:'開心 2', smile:'微笑', angry:'生氣', angry2:'生氣 2',
  angryloop:'生氣（循環）', angrytalk:'生氣地講話', RAGE:'暴怒', sad:'難過', sad2:'難過 2',
  sadloop:'難過（循環）', scared:'害怕', scaredloop:'害怕（循環）',
  scaredloop2:'害怕（循環）2', scaredloop3:'害怕（循環）3',
  thinking:'思考', thinkingloop:'思考（循環）', thinkingloop3:'思考（循環）3',
  question:'疑問（問號）', hmm:'疑惑', noway:'不會吧', what:'什麼？！',
  exclamation:'驚訝（驚嘆號）', suprised:'嚇一跳', sigh:'嘆氣', sighloop:'嘆氣（循環）',
  heart:'心心', love:'戀愛', love2:'戀愛 2', love3:'戀愛 3',
  lovestart:'戀愛（開始）', loveloop:'戀愛（循環）',
  bling:'閃亮亮', blingloop:'閃亮亮（循環）', goodgood:'讚讚', yummy:'好吃',
  eee:'欸欸欸', '666':'666', proud:'得意', ghost:'鬼樣子', sirious:'認真',
  beer:'喝酒', cat:'貓', cat2:'貓 2', wave:'揮手', Scene1:'場景 1',
  test:'測試用', 'idle 复制':'待機（重複的檔，別用）'
};
const exprLabel = e => EXPR_ZH[e] ? EXPR_ZH[e] + '　' + e : e;

// 對白行的表情選單。表情多半是寫在說話者那一行，
// 所以選單就放在那一句旁邊，不用記得有哪些可以用。
function talkExpr(x) {
  const list = (ASSETS.expressions || {})[x.who];
  if (!list || list.length < 2) return '';
  return '<select class="expr inline" title="' + esc(x.who) + ' 的表情"' +
    ' onchange="setTalkExpr(' + x.line + ', this.value)">' +
    '<option value=""' + (x.app ? '' : ' selected') + '>（沿用）</option>' +
    list.map(e => '<option value="' + esc(e) + '"' + (e === x.app ? ' selected' : '') + '>' +
      esc(exprLabel(e)) + '</option>').join('') +
    '</select>';
}

// 改對白行開頭那個「名字.表情:」。選（沿用）就把表情拿掉。
function setTalkExpr(line, app) {
  const sc = scripts[current];
  sc.lines[line - 1] = sc.lines[line - 1].replace(
    /^(\s*)([^\s:@#]+?)(?:\.[^\s:]+)?(\s*:)/,
    (_, indent, who, colon) => indent + who + (app ? '.' + app : '') + colon);
  dirty.add(sc.name); check(); render();
}

// 表情選單。ASSETS.expressions 是角色 prefab 旁邊那些 .anim。
function exprPicker(id, app, line, shotLine) {
  const list = (ASSETS.expressions || {})[id];
  if (!list || list.length < 2) return '';
  return '<select class="expr" title="換這一幕的表情"' +
    ' onpointerdown="event.stopPropagation()"' +
    ' onchange="setExpr(&quot;' + esc(id) + '&quot;,' + line + ',' + shotLine + ', this.value)">' +
    '<option value=""' + (app ? '' : ' selected') + '>（沿用）</option>' +
    list.map(x => '<option value="' + esc(x) + '"' + (x === app ? ' selected' : '') + '>' +
      esc(exprLabel(x)) + '</option>').join('') +
    '</select>';
}

// 換表情。她的 @char 在這一幕裡就直接改那行；在更早的幕就得插新的一行，
// 不然會連前面幾幕的表情一起改掉。
function setExpr(id, line, shotLine, app) {
  const sc = scripts[current];
  const token = app ? id + '.' + app : id;

  if (line >= shotLine) {
    sc.lines[line - 1] = sc.lines[line - 1].replace(/^(\s*@char )(\S+)/,
      (_, head, tok) => head + token + (tok.includes(',') ? ',' + tok.split(',').slice(1).join(',') : ''));
  } else {
    const shot = sceneShots(sc).find(x => x.line === shotLine);
    const me = shot && shot.actors.find(a => a[0] === id);
    sc.lines.splice(shotLine - 1, 0, '@char ' + token + (me ? ' pos:' + me[1] : ''));
  }
  dirty.add(sc.name); check(); render();
}

// 取消這支腳本這一輪的所有修改，回到上次存檔（或剛載入）的樣子。
// original 是那個基準：存檔成功時會更新它。
function revertScript() {
  const sc = scripts[current];
  const n = sc.lines.length - sc.original.split(NL).length;
  const how = n > 0 ? '多了 ' + n + ' 行' : n < 0 ? '少了 ' + (-n) + ' 行' : '行數沒變';
  if (!confirm('「' + sc.name + '」這次的修改（' + how + '）全部不要，回到上次存檔的樣子？')) return;
  sc.lines = sc.original.split(NL);
  dirty.delete(sc.name);
  check(); render();
}

// 空行在 Naninovel 裡沒有作用，只是把編輯畫面撐得零零落落。
// 一鍵清掉這支腳本的空行——段落之間留一行，那個是給人看的。
function blankCount(sc) {
  return sc.lines.filter((l, i) => !l.trim() && !isSeparator(sc, i)).length;
}

// 「# 段落」前面那一行空白留著，看起來比較好斷
function isSeparator(sc, i) {
  const next = (sc.lines[i + 1] || '').trim();
  return next.startsWith('#') && (sc.lines[i - 1] || '').trim() !== '';
}

function dropBlanks() {
  const sc = scripts[current];
  const before = sc.lines.length;
  sc.lines = sc.lines.filter((l, i) => l.trim() || isSeparator(sc, i));
  if (sc.lines.length === before) return;
  dirty.add(sc.name); check(); render();
}

// 刪掉一整行。空行、多餘的括號那種，用改的改不掉，要整行拿走。
function delLine(line) {
  const sc = scripts[current];
  sc.lines.splice(line - 1, 1);
  dirty.add(sc.name); check(); render();
}

// 直接改對白。只動那一行的文字，行號不變。
function editLine(line, el) {
  const sc = scripts[current];
  const text = el.textContent.replace(/\s+$/, '');
  if (text === sc.lines[line - 1].trim()) return;
  if (!text) { el.textContent = sc.lines[line - 1].trim(); return; }   // 空的就還原，要刪請去改檔案
  const indent = (sc.lines[line - 1].match(/^\s*/) || [''])[0];
  sc.lines[line - 1] = indent + text;
  dirty.add(sc.name); check(); render();
}

// 拿掉一個人。要做的事有兩件，看情況做一件或兩件：
//   ‧ 她的 @char 就在這一幕裡 → 刪掉那一行（不刪的話等一下的 @hide 會被它抵消）
//   ‧ 她是前面就在場的        → 在這一幕開頭插一行 @hide
// 兩件都做完之後，剩下的人重新排位。
function removeActor(id, line, fresh, shotLine) {
  const sc = scripts[current];
  const shot = sceneShots(sc).find(x => x.actors.some(a => a[0] === id && a[2] === line));
  if (!shot) return;

  let rest = shot.actors.filter(a => a[0] !== id);
  const inThisShot = line >= shotLine;

  if (inThisShot) {
    sc.lines.splice(line - 1, 1);
    rest = rest.map(([i, p, l]) => [i, p, l > line ? l - 1 : l]);
  }
  if (!fresh) {
    const at = shotLine - 1;
    sc.lines.splice(at, 0, '@hide ' + id);
    rest = rest.map(([i, p, l]) => [i, p, l > at ? l + 1 : l]);
  }

  dirty.add(sc.name);
  check();
  if (rest.length) applySlots(rest, shotLine); else render();
}

// 換背景：直接改那一行的 @back
// 換背景：這一幕有自己的 @back 就改那一行；沒有的話，
// 在這一幕開頭插一行——從這裡開始換景，前面幾幕不受影響。
function setBack(line, insertAt, name) {
  const sc = scripts[current];
  if (!name) return render();

  if (line) sc.lines[line - 1] = sc.lines[line - 1].replace(/@back \S+/, '@back ' + name);
  else sc.lines.splice(Math.max(0, insertAt - 1), 0, '@back ' + name);
  dirty.add(sc.name);
  render();
}

// 換音樂：有 @bgm 就改那一行，沒有就插在 @back 後面——
// 音樂要跟著換場一起響，不是等角色出來才響。
// 這行 @bgm 前面要有 @stopBgm，沒有就補一行。
// 全劇本 251 行 @bgm 裡有 219 行本來就是這樣寫的，這是這個專案的慣例。
function ensureStopBefore(idx) {
  const sc = scripts[current];
  for (let k = idx - 1; k >= 0; k--) {
    const t = sc.lines[k].trim();
    if (!t) continue;
    if (/^@stopBgm/i.test(t)) return;          // 已經有了
    break;
  }
  sc.lines.splice(idx, 0, '@stopBgm');
}

function setBgm(line, insertAt, name) {
  const sc = scripts[current];
  if (!name) return render();          // 選了「不換曲」＝不動

  const cur = line ? sc.lines[line - 1] : '';
  if (/@bgm\s+\S+/.test(cur)) {
    sc.lines[line - 1] = cur.replace(/@bgm\s+\S+/, '@bgm ' + name);
    ensureStopBefore(line - 1);
  } else if (/@stopBgm/i.test(cur)) {
    // 這一幕原本是「停掉音樂」，改成從這裡放這首
    sc.lines[line - 1] = cur.replace(/@stopBgm\S*/i, '@bgm ' + name);
    ensureStopBefore(line - 1);
  } else if (insertAt > 0) {
    // 從這一幕開始換曲：插在這一幕的第一行之前。
    // 一定要連 @stopBgm 一起寫——Naninovel 的 BGM 會疊著放，
    // 只下 @bgm 的話舊的那首不會停，兩首一起響。
    sc.lines.splice(insertAt - 1, 0, '@stopBgm', '@bgm ' + name);
  } else {
    return;                            // 不知道要改哪裡就什麼都別做，別亂插
  }
  dirty.add(sc.name);
  render();
}

// ── 站位是算出來的，不是隨便擺的 ──────────────────────
// 從整包劇本統計出來的慣例（次數壓倒性）：
//   1 人 50 ／ 2 人 35,65 ／ 3 人 25,50,75 ／ 4 人 20,40,60,80
// 規律就是等分：第 i 個站在 100*i/(n+1)。2 人的 33/67 被四捨五入寫成 35/65，
// 用得太多了所以照抄，其餘照公式算。
function slotsFor(n) {
  if (n <= 0) return [];
  if (n === 1) return [50];
  if (n === 2) return [35, 65];
  return Array.from({length: n}, (_, i) => Math.round(100 * (i + 1) / (n + 1)));
}

// 這一幕的站位合不合慣例
function isCanonical(actors) {
  const want = slotsFor(actors.length);
  return actors.every(([, pos], i) => pos === want[i]);
}

// 把整幕的人按目前的左右順序重新排到標準站位
// 依左右順序把站位拉回慣例。shotLine 是這一幕的第一行：
// 有人的 @char 在更早的幕（她是站著沒動、一路延續下來的），
// 直接改那一行會把前面幾幕的站位一起動到，所以要在這一幕補一行新的。
function applySlots(order, shotLine) {
  const want = slotsFor(order.length);
  const sc = scripts[current];
  const inserts = [];

  order.forEach(([id, , line], i) => {
    if (shotLine && line < shotLine) { inserts.push('@char ' + id + ' pos:' + want[i]); return; }
    const idx = line - 1, old = sc.lines[idx];
    sc.lines[idx] = /pos:[\d.]+/.test(old) ? old.replace(/pos:[\d.]+/, 'pos:' + want[i])
                                            : old.trimEnd() + ' pos:' + want[i];
  });
  if (inserts.length) sc.lines.splice(shotLine - 1, 0, ...inserts);

  dirty.add(sc.name);
  render();
}

function wireDragging() {
  // 拖名牌 → 只換順序，位置還是由人數決定
  document.querySelectorAll('.actor').forEach(el => {
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      const stage = el.parentElement;
      const peers = [...stage.querySelectorAll('.actor')];
      const slots = slotsFor(peers.length);
      let from = peers.indexOf(el), to = from;

      el.classList.add('drag');
      el.setPointerCapture(e.pointerId);

      const move = ev => {
        const r = stage.getBoundingClientRect();
        const pct = (ev.clientX - r.left) / r.width * 100;
        // 找最接近的槽，拖動時只在槽之間跳，不會停在中間
        to = slots.reduce((best, s, i) =>
          Math.abs(s - pct) < Math.abs(slots[best] - pct) ? i : best, 0);
        el.style.left = slots[to] + '%';
        el.querySelector('.pos').textContent = '第 ' + (to + 1) + ' 位';
      };
      const up = () => {
        el.releasePointerCapture(e.pointerId);
        el.classList.remove('drag');
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        if (to === from) return render();

        const order = peers.map(p => [p.dataset.id, +p.dataset.pos, +p.dataset.line]);
        const [moved] = order.splice(from, 1);
        order.splice(to, 0, moved);
        applySlots(order, +stage.dataset.line);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
    });
  });

  // 從調色盤把角色拖進畫面 → 插一行 @char，然後整幕重排
  document.querySelectorAll('#bar .chip').forEach(chip => {
    chip.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', chip.dataset.id));
  });
  document.querySelectorAll('.stage').forEach(stage => {
    stage.addEventListener('dragover', e => {e.preventDefault(); stage.classList.add('hot')});
    stage.addEventListener('dragleave', () => stage.classList.remove('hot'));
    stage.addEventListener('drop', e => {
      e.preventDefault(); stage.classList.remove('hot');
      const id = e.dataTransfer.getData('text/plain');
      if (!id) return;

      const r = stage.getBoundingClientRect();
      const pct = (e.clientX - r.left) / r.width * 100;
      const peers = [...stage.querySelectorAll('.actor')]
        .map(p => [p.dataset.id, +p.dataset.pos, +p.dataset.line]);
      if (peers.some(([pid]) => pid === id)) return alert(id + ' 已經在這一幕了');

      // 插在最接近放手位置的地方
      let at = peers.findIndex(([, pos]) => pos > pct);
      if (at < 0) at = peers.length;

      const sc = scripts[current];
      const line = +stage.dataset.insert;
      sc.lines.splice(line, 0, '@char ' + id + ' pos:50');
      dirty.add(sc.name);

      // 插入之後後面的行號會位移，重新算一次再排
      const shifted = peers.map(([pid, pos, ln]) => [pid, pos, ln > line ? ln + 1 : ln]);
      shifted.splice(at, 0, [id, 50, line + 1]);
      check();
      applySlots(shifted, +stage.dataset.line);
    });
  });
}

async function saveOne(name, force) {
  const sc = scripts[name];
  const text = sc.lines.join(NL);
  const res = await fetch('/save', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({file: sc.name + '.nani', content: text,
                          original: force ? undefined : sc.original})
  }).then(r => r.json()).catch(err => ({ok: false, error: err.message}));

  if (res.ok) { sc.original = text; dirty.delete(name); return res; }

  // 檔案在外面被改過了。以前只丟一句「請重跑 build_viewer.py」，
  // 但那要關掉分頁重開，很煩。現在直接讓你挑。
  if (res.stale) {
    if (!dirty.has(name)) {          // 自己沒改過 → 直接吃下硬碟的版本，不用問
      adopt(name, res.content);
      return await saveOne(name);
    }
    const keep = confirm('「' + name + '」在別的地方被改過了。' + NL + NL +
      '按「確定」＝用你現在編輯器裡的版本蓋過去' + NL +
      '按「取消」＝丟掉你這次的修改，載入硬碟上的版本');
    if (keep) return await saveOne(name, true);
    adopt(name, res.content);
    renderList(); render();
    return {ok: true, reloaded: true};
  }
  return res;
}

// 把硬碟上的內容吃進來當成新的基準
function adopt(name, content) {
  const sc = scripts[name];
  sc.lines = content.split(new RegExp('\\r?\\n'));
  sc.original = sc.lines.join(NL);
  dirty.delete(name);
}

// 回到這個分頁時，把沒在編輯的腳本悄悄更新成硬碟上的版本，
// 這樣就不會一存檔才發現整份都過期了。
async function refreshFromDisk(name) {
  if (dirty.has(name)) return false;
  const res = await fetch('/raw?file=' + encodeURIComponent(name + '.nani'))
    .then(r => r.json()).catch(() => null);
  if (!res || !res.ok) return false;
  const strip = x => x.split(String.fromCharCode(13)).join('');
  if (strip(res.content) === strip(scripts[name].original)) return false;
  adopt(name, res.content);
  return true;
}

async function saveScript() {
  const res = await saveOne(current);
  if (!res.ok) alert('存檔失敗：' + (res.error || '？'));
  renderList(); render();
}

// 一鍵存掉所有沒存的
async function saveAll() {
  const bad = [];
  for (const n of [...dirty]) {
    const res = await saveOne(n);
    if (!res.ok) bad.push(n + '：' + (res.error || '？'));
  }
  renderList(); render();
  if (bad.length) alert('有 ' + bad.length + ' 支沒存成功：' + NL + bad.join(NL));
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


// 內建資料版（build_viewer.py 產生）：打開就直接進畫面，不用拖檔案
if (EMBEDDED) {
  for (const name in EMBEDDED)
    scripts[name] = {name, lines: EMBEDDED[name].split(/\r?\n/), original: EMBEDDED[name]};
  check();
  drop.classList.add('hide');
  document.getElementById('app').classList.add('show');
  renderList();
  syncTabs();
  select(Object.keys(scripts).sort(scriptOrder)[0]);
}
